name: grading_app
description: Scholaro – Student Grade & Portfolio Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.3.0

  # PDF Import (parsing student lists)
  syncfusion_flutter_pdf: ^26.2.14

  # PDF Export
  pdf: ^3.11.1
  printing: ^5.13.1

  # File & Image Picking
  file_picker: ^8.1.2
  image_picker: ^1.1.2

  # Network Images with cache
  cached_network_image: ^3.4.1

  # Local Session Storage
  shared_preferences: ^2.3.2

  # HTTP (for Firebase Auth REST API - student account creation)
  http: ^1.2.2

  # Text-to-Speech (Android only)
  flutter_tts: ^4.2.0

  # Utilities
  uuid: ^4.4.2
  intl: ^0.19.0

  # Cross-platform file abstraction (web + native)
  cross_file: ^0.3.4

  # Path utilities
  path: ^1.9.0
  path_provider: ^2.1.4
  archive: ^3.6.1
  share_plus: ^10.1.4

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
